name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows NSIS
        run: npx tauri build --bundles nsis
      - name: Show Windows artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs:
      - windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows
          path: artifacts/windows
      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f -print
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/windows/**/*.exe
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## QQ 空间恢复归档（Windows）

            这是一个本地优先的 QQ 空间恢复归档工具，将当前可见说说、旧历史残留和互动记录进行结构化合并，并提供相册、视频、留言板、旧收藏、联系人互动、年份筛选、全文搜索和离线导出。

            ### 下载说明

            - Windows 安装版：下载 `.exe` 安装程序（NSIS 向导，默认安装到 `D:\QQ空间恢复归档`）
            - Windows 便携版：单文件 EXE，解压即用（必须解压后运行）

            ### 重要说明

            “恢复已删除内容”依赖 QQ 接口仍保留的点赞、评论、回复或其他互动残留。没有互动痕迹、服务端已彻底清除、无权访问或接口不再返回的内容无法恢复，也不能保证结果完整。请仅归档本人账号或已获授权的数据。

            本项目基于 Gaoshu705/QzoneArchive 进行 GPLv3 二次开发，参考项目与完整免责声明见仓库 README 和 THIRD_PARTY_NOTICES。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
