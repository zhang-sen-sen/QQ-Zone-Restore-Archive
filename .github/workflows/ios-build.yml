name: "Build iOS (iPhone + iPad Universal)"

# 触发方式：
#   1. 在 GitHub 仓库页面 Actions 标签页手动运行（workflow_dispatch）
#   2. 推送 v 开头的 tag（如 v2.0.0）
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-ios
            aarch64-apple-ios-sim
            x86_64-apple-ios

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize iOS project
        run: npx tauri ios init

      # 模拟器版（无需签名，必定成功；供 Mac 上预览 / 真机调试）
      # tauri CLI 2.x 的 --target 使用简化名：aarch64 / aarch64-sim / x86_64
      - name: Build iOS app (simulator, arm64)
        run: npx tauri ios build --target aarch64-sim

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: |
            src-tauri/gen/apple/build
            src-tauri/target/aarch64-apple-ios-sim/release

      # 真机设备版：无 Apple 开发者签名时产出“未签名 IPA”
      # 在 pbxproj 工程级注入 CODE_SIGNING_ALLOWED=NO（tauri CLI 不透传命令行签名参数），
      # 再走 tauri ios build（自带 xcode-script 服务器），产出可后续自行签名的未签名 .app
      - name: Build iOS app (device, unsigned IPA)
        run: |
          npx tauri ios init --ci
          python3 - <<'EOF'
          import re
          p = "src-tauri/gen/apple/qzonearchive.xcodeproj/project.pbxproj"
          s = open(p, encoding="utf-8").read()
          inject = (
              "CODE_SIGNING_ALLOWED = NO;\n"
              "CODE_SIGNING_REQUIRED = NO;\n"
              "CODE_SIGN_IDENTITY = \"\";\n"
              "CODE_SIGN_STYLE = Manual;\n"
              "PROVISIONING_PROFILE_SPECIFIER = \"\";\n"
          )
          s, n = re.subn(r"(buildSettings = \{)", lambda m: m.group(1) + "\n" + inject, s)
          open(p, "w", encoding="utf-8").write(s)
          print("injected CODE_SIGNING into", n, "buildSettings blocks")
          EOF
          # 构建产物 .app 在 export 前已生成；tauri 的 exportArchive 无签名 Team 必然失败（exit 70），
          # 用 `|| true` 保留 .app，随后手动打包为未签名 IPA
          npx tauri ios build --target aarch64 || true
          echo "=== build tree ==="
          find src-tauri/gen/apple/build -maxdepth 6 -type d 2>/dev/null | head -40 || echo "no gen/apple/build dir"
          APP_PATH=$(find . "$HOME/Library/Developer/Xcode/DerivedData" -name "qzonearchive.app" -path "*Release-iphoneos*" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到真机 .app 产物"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "QQ-Zone-Archive-v2.0.0-ios-unsigned.ipa" Payload
          ls -la "QQ-Zone-Archive-v2.0.0-ios-unsigned.ipa"

      - name: Upload device app (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-device
          if-no-files-found: warn
          path: |
            QQ-Zone-Archive-v2.0.0-ios-unsigned.ipa
            src-tauri/gen/apple/build
            src-tauri/target/aarch64-apple-ios/release
